name: LilaShift IPA preflight unit tests
on:
  pull_request:
    paths:
      - "scripts/check_ipa_signing_preflight.py"
      - "scripts/test_check_ipa_signing_preflight.py"
      - ".github/workflows/ipa-preflight-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read-only mock IPA inspection tests
        run: python3 -m unittest discover -s scripts -p "test_check_ipa_signing_preflight.py" -v
