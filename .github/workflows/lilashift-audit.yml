name: LilaShift static source audit (no deployment)

# This workflow only checks sources and attribution for proposed changes.
# It never builds a signed IPA, modifies Release assets, or writes to devices.
on:
  pull_request:
    paths:
      - "china-unlock-v107.patch"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/**"
      - "scripts/check_lilashift_patch.py"
      - ".github/workflows/lilashift-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out LilaShift build inputs
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify patch format, source lineage and license attribution
        run: python3 scripts/check_lilashift_patch.py
      - name: Check out the exact original GestaltX source
        uses: actions/checkout@v4
        with:
          repository: huamidev/GestaltX
          ref: dfd4a7e3a8b8a89e76ac025a2a37242a7ed4c41f
          path: upstream
          persist-credentials: false
      - name: Verify the development patch applies cleanly
        run: git -C upstream apply --check ../china-unlock-v107.patch
