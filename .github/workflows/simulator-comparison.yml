name: Compare GestaltX Screens
on:
  push:
    branches: [codex/simulator-comparison]

permissions:
  contents: read

concurrency:
  group: gestaltx-simulator-comparison
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: xcode-27
    timeout-minutes: 22
    steps:
      - name: Check out comparison inputs
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out official GestaltX v1.0.6
        uses: actions/checkout@v7
        with:
          repository: huamidev/GestaltX
          ref: 72f46754820991c5c7706afce9573b117aadbae7
          path: upstream
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Select the comparison simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          SIM="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = [key for key in devices if re.search(r"\.iOS-\d", key)]
          for name in ("iPhone 18 Pro Max", "iPhone 17", "iPhone 18 Pro", "iPhone Air"):
              for runtime in sorted(runtimes, key=lambda value: tuple(map(int, re.search(r"\.iOS-(\d+(?:-\d+)*)", value).group(1).split("-"))), reverse=True):
                  for device in devices[runtime]:
                      if device.get("isAvailable") and device["name"] == name:
                          print(device["udid"])
                          print(name + " / " + runtime, file=sys.stderr)
                          sys.exit(0)
          sys.exit("No supported iPhone simulator")
          ')"
          test -n "$SIM"
          echo "COMPARISON_SIM=$SIM" >> "$GITHUB_ENV"

      - name: Build both versions and capture the same screens
        run: |
          set -euo pipefail
          screens="$GITHUB_WORKSPACE/screenshots"
          mkdir -p "$screens"
          cd upstream
          app="$RUNNER_TEMP/simulator-build/Debug-iphonesimulator/GestaltX.app"
          bundle="com.huami.gestultx"
          python3 - "$RUNNER_TEMP/Comparison.plist" <<'PY'
          import plistlib, sys
          cache = bytearray(720 * 9)
          cache[383 * 8] = 1
          cache[720 * 8 + 383] = cache[720 * 8 + 506] = 1
          doc = {
              "CacheUUID": "7F1DF278-18B7-4E5A-8425-09E8830DE9AF",
              "CacheVersion": "24C5037i",
              "CacheData": bytes(cache),
              "CacheExtra": {
                  "h9jDsbgj7xIVeIQ8S3/X3Q": "iPhone18,1",
                  "Z/dqyWS6OZTRy10UcmUAhw": "iPhone 17 Pro",
                  "h63QSdBCiT/z0WU6rdQv6Q": "CH",
                  "zHeENZu+wbg7PUprwNwBWg": "CH/A",
                  "yK+xavymRGZ3xWc1tb8XDg": "CH/A",
                  "97JDvERpVwO+GHtthIh7hA": "A3518",
                  "K/R1GfGfCkXvEhaPS2Vrng": 2,
              },
          }
          with open(sys.argv[1], "wb") as handle:
              plistlib.dump(doc, handle, fmt=plistlib.FMT_BINARY)
          PY

          build() {
            python3 -X utf8 scripts/generate_localization.py
            xcodebuild -project GestaltX.xcodeproj -scheme GestaltX -configuration Debug -scmProvider system \
              -destination "generic/platform=iOS Simulator" -sdk iphonesimulator ARCHS=arm64 \
              -derivedDataPath "$RUNNER_TEMP/simulator-build" SYMROOT="$RUNNER_TEMP/simulator-build" \
              COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build
            codesign --force --sign - --deep "$app"
          }

          capture() {
            output="$1"
            shift
            xcrun simctl terminate "$COMPARISON_SIM" "$bundle" 2>/dev/null || true
            xcrun simctl launch "$COMPARISON_SIM" "$bundle" \
              -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN \
              --preview-document "$fixture" --preview-tab 0 "$@"
            sleep 5
            xcrun simctl io "$COMPARISON_SIM" screenshot "$screens/$output.png"
          }

          capture_version() {
            version="$1"
            xcrun simctl install "$COMPARISON_SIM" "$2"
            data="$(xcrun simctl get_app_container "$COMPARISON_SIM" "$bundle" data)"
            mkdir -p "$data/Documents"
            fixture="$data/Documents/Comparison.plist"
            cp "$RUNNER_TEMP/Comparison.plist" "$fixture"
            capture "$version-tools"
            capture "$version-display" --preview-category Display
            capture "$version-review" --preview-review --preview-cache-option
            xcrun simctl terminate "$COMPARISON_SIM" "$bundle"
            xcrun simctl uninstall "$COMPARISON_SIM" "$bundle"
          }

          echo "Building official v1.0.6 for the simulator"
          build
          original="$RUNNER_TEMP/Original-GestaltX.app"
          ditto "$app" "$original"

          git apply --check ../china-unlock.patch
          git apply ../china-unlock.patch
          echo "Building the optimized version for the simulator"
          build

          echo "Booting the simulator"
          xcrun simctl boot "$COMPARISON_SIM"
          xcrun simctl bootstatus "$COMPARISON_SIM" -b
          xcrun simctl list devices booted > "$screens/simulator.txt"
          xcrun simctl ui "$COMPARISON_SIM" appearance light || true
          xcrun simctl status_bar "$COMPARISON_SIM" override --time "9:41" || true
          echo "Capturing the official version"
          capture_version original "$original"
          echo "Capturing the optimized version"
          capture_version optimized "$app"

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gestaltx-simulator-screens
          path: screenshots/
          if-no-files-found: error
          retention-days: 7
